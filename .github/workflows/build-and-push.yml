name: build-and-push

on:
  workflow_dispatch:            # manual “Run workflow” button
  push:
    branches: [main]
    paths:
      - "pyproject.toml"        # 🚦 only these two trigger CI
      - "uv.lock"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64          # matches your GPU nodes
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cs336-assignment1-basics:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cs336-assignment1-basics:latest
          cache-from: type=gha            # layer cache
          cache-to:   type=gha,mode=max
