name: build-and-push
on:
  push:
    branches: [main]          # build every merge to main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:              # let the workflow push to GHCR
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Builder & QEMU so we can add other platforms later if needed
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3             # buildx docs :contentReference[oaicite:3]{index=3}

      # Log in to GitHub Container Registry with the workflow token
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build, reuse cache, push two tags (commit-SHA & latest)
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64                # matches your GPU nodes
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cs336-assignment1-basics:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cs336-assignment1-basics:latest
          cache-from: type=gha                  # pull previous cache
          cache-to:   type=gha,mode=max         # save updated cache
